name: Release

# Stages the version on npm and drafts the GitHub release when a version tag (X.Y.Z, no "v") is
# pushed. npm trusts this workflow through Trusted Publishing (OIDC), so no npm token is stored here,
# and the trust only allows staging: a maintainer approves the staged version with 2FA to publish it.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write  # create the GitHub release
  id-token: write  # npm Trusted Publishing and provenance

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Staged publishing (npm stage publish) needs a recent npm 11.
      - name: Update npm
        run: npm install -g npm@11

      - name: Tag matches package.json and is on master
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME is not on master"
            exit 1
          fi

      # Written outside the checkout, so npm doesn't pack it with the package.
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Quality checks
        run: npm run check

      # Provenance is generated automatically with Trusted Publishing.
      - name: Stage on npm
        run: npm stage publish

      # A draft, published by hand once the npm version is approved.
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      - name: Next steps
        run: |
          {
            echo "### $GITHUB_REF_NAME is staged on npm"
            echo "1. Approve it with 2FA: \`npm stage list react-native-callkeep\`, then \`npm stage approve <stage-id>\` (or on npmjs.com)."
            echo "2. Publish the draft GitHub release for $GITHUB_REF_NAME."
          } >> "$GITHUB_STEP_SUMMARY"
