version: 2
updates:
  # Keep the GitHub Actions used by CI current (security patches).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The example app: one grouped pull request a week, and one for security fixes. Major versions are
  # left out: a React Native upgrade follows the template's upgrade steps, not a version bump.
  - package-ecosystem: "npm"
    directory: "/example"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      example:
        applies-to: version-updates
        patterns: ["*"]
      example-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
